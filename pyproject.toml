[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vasl-ai-bridge"
version = "1.1.0"
description = "VASL AI Bridge: a local desktop companion for a human-mediated ASL opponent"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.11.2",
    "Pillow==12.2.0",
]

[project.gui-scripts]
vasl-ai-bridge = "vasl_ai_bridge.launcher:main"
asl-ai = "vasl_ai_bridge.launcher:main"

[tool.setuptools.packages.find]
include = ["vasl_ai_bridge*"]

[tool.setuptools.package-data]
vasl_ai_bridge = ["assets/*.ico"]
